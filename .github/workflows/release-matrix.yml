# ──────────────────────────────────────────────────────────────
# CodeIn — Multi-Platform Release Matrix Build
# ──────────────────────────────────────────────────────────────
#
# Builds Electron distributables for:
#   • Windows x64  (NSIS installer + portable)
#   • macOS x64    (DMG)
#   • macOS arm64  (DMG)
#   • Linux x64    (AppImage + deb)
#
# Each job:
#   1. Downloads the correct llama-server prebuilt binary
#   2. Builds the Electron target
#   3. Runs a binary-level smoke test (start → health → shutdown)
#   4. Uploads artifacts + checksums
#
# Trigger: manual dispatch or pushing a v* tag.
#
# Required secrets for signing (optional for beta):
#   APPLE_ID, APPLE_ID_PASSWORD, APPLE_TEAM_ID  (macOS notarization)
#   CSC_LINK, CSC_KEY_PASSWORD                   (Windows code signing)
# ──────────────────────────────────────────────────────────────

name: "CodeIn Release Matrix"

on:
  workflow_dispatch:
    inputs:
      llama_release:
        description: "llama.cpp release tag (e.g. b3906)"
        required: true
        default: "b3906"
  # Tag-based triggers are handled exclusively by electron-release.yml to avoid
  # duplicate release runs. Use workflow_dispatch to trigger this matrix manually.

permissions:
  contents: write

env:
  NODE_VERSION: "20"
  LLAMA_RELEASE: ${{ github.event.inputs.llama_release || 'b3906' }}
  # Official Qwen org on HuggingFace — stable, no account required, ~270 MB
  TEST_MODEL_URL: "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q2_k.gguf"
  MIN_BIN_BYTES: "1000000"
  MIN_MODEL_BYTES: "50000000"

jobs:
  # ════════════════════════════════════════════════════════════
  # JOB 1: Build Windows x64
  # ════════════════════════════════════════════════════════════
  build-win-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }

      - name: Cache tiny GGUF model
        uses: actions/cache@v4
        with:
          path: electron-app/resources/models
          key: tiny-gguf-${{ runner.os }}-${{ hashFiles('.github/workflows/release-matrix.yml') }}

      - name: Fetch tiny GGUF model
        shell: pwsh
        continue-on-error: true
        run: |
          $modelDir = "electron-app/resources/models"
          New-Item -ItemType Directory -Force -Path $modelDir | Out-Null
          $modelPath = "$modelDir/tiny.gguf"
          if (-not (Test-Path $modelPath)) {
            try {
              Invoke-WebRequest -Uri "${{ env.TEST_MODEL_URL }}" -OutFile $modelPath -MaximumRetryCount 2 -TimeoutSec 120
            } catch {
              Write-Warning "GGUF model download failed: $_"
              if (Test-Path $modelPath) { Remove-Item $modelPath -Force }
            }
          }
          if (Test-Path $modelPath) {
            $size = (Get-Item $modelPath).Length
            if ($size -lt [int64]"${{ env.MIN_MODEL_BYTES }}") {
              Write-Warning "GGUF model too small ($size bytes), removing"
              Remove-Item $modelPath -Force
            } else {
              Write-Host "Model OK: $size bytes"
              "MODEL_PATH=$modelPath" | Out-File -FilePath $env:GITHUB_ENV -Append
            }
          } else {
            Write-Warning "No GGUF model available — inference smoke tests will be skipped"
          }

      # ── Download llama-server for win32/x64 into resources/bin ──
      - name: Fetch llama-server (win32/x64)
        shell: pwsh
        run: |
          $dir = "electron-app/resources/bin/win32/x64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $bin = "$dir/codein-llm.exe"
          if (-not (Test-Path $bin)) {
            $tag = "${{ env.LLAMA_RELEASE }}"
            $url = "https://github.com/ggml-org/llama.cpp/releases/download/${tag}/llama-${tag}-bin-win-avx2-x64.zip"
            Write-Host "Downloading $url"
            Invoke-WebRequest -Uri $url -OutFile "$dir/llama.zip" -MaximumRetryCount 3
            Expand-Archive -Path "$dir/llama.zip" -DestinationPath "$dir/tmp" -Force
            $exe = Get-ChildItem -Recurse "$dir/tmp" -Filter "llama-server.exe" | Select-Object -First 1
            if (-not $exe) { throw "llama-server.exe missing in downloaded archive" }
            $root = Split-Path $exe.FullName -Parent
            Copy-Item "$root\*" $dir -Recurse -Force
            Remove-Item -Recurse -Force "$dir/tmp","$dir/llama.zip" -ErrorAction SilentlyContinue
            # Rename for branding
            if (Test-Path "$dir/llama-server.exe") {
              Rename-Item "$dir/llama-server.exe" "codein-llm.exe"
            }
          }
          if (-not (Test-Path $bin)) { throw "Missing binary: $bin" }
          $len = (Get-Item $bin).Length
          if ($len -lt [int]"${{ env.MIN_BIN_BYTES }}") { throw "Binary too small: $len" }
          # Verify DLLs
          if (-not (Test-Path "$dir/ggml.dll")) { throw "FATAL: ggml.dll missing after extraction!" }
          if (-not (Test-Path "$dir/llama.dll")) { throw "FATAL: llama.dll missing after extraction!" }
          & $bin --help | Out-Null

      - name: Mirror binaries to legacy assets path
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "electron-app/assets/llama/win32/x64" | Out-Null
          # Copy ALL files (exe + DLLs like ggml.dll, llama.dll) to assets path
          Copy-Item "electron-app/resources/bin/win32/x64/*" "electron-app/assets/llama/win32/x64/" -Recurse -Force
          Get-ChildItem "electron-app/assets/llama/win32/x64" | Format-Table Name, Length
          # Verify critical DLLs in assets path
          if (-not (Test-Path "electron-app/assets/llama/win32/x64/ggml.dll")) { throw "FATAL: ggml.dll missing from assets!" }
          if (-not (Test-Path "electron-app/assets/llama/win32/x64/codein-llm.exe")) { throw "FATAL: codein-llm.exe missing from assets!" }

      # ── Install + build ──
      - name: Install electron-app dependencies
        working-directory: electron-app
        run: npm install

      - name: Build TypeScript
        working-directory: electron-app
        run: npm run build

      - name: Run E2E inference smoke (if model available)
        shell: pwsh
        continue-on-error: true
        run: |
          $model = "electron-app/resources/models/tiny.gguf"
          if (-not (Test-Path $model)) {
            Write-Warning "Skipping E2E inference smoke — no model downloaded"
            exit 0
          }
          $env:LLAMA_PATH = "${{ github.workspace }}\electron-app\resources\bin\win32\x64\codein-llm.exe"
          $env:LLAMA_TEST_MODEL = "${{ github.workspace }}\electron-app\resources\models\tiny.gguf"
          node --test electron-app/test/llama-spawn.e2e.test.cjs

      # ── Package ──
      - name: Build Electron (Windows NSIS + Portable)
        working-directory: electron-app
        run: npx electron-builder --win nsis portable --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Inference smoke (if model available)
        shell: pwsh
        continue-on-error: true
        run: |
          $bin = "electron-app/resources/bin/win32/x64/codein-llm.exe"
          $model = "electron-app/resources/models/tiny.gguf"
          if (-not (Test-Path $model)) {
            Write-Warning "Skipping inference smoke — no model downloaded"
            exit 0
          }
          $p = Start-Process -FilePath $bin -ArgumentList "--model",$model,"--port","18099","--host","127.0.0.1","--ctx-size","256","--n-gpu-layers","0" -PassThru -NoNewWindow
          Start-Sleep -Seconds 15
          try {
            $health = Invoke-WebRequest -Uri "http://127.0.0.1:18099/health" -TimeoutSec 10
            if ($health.StatusCode -ne 200) { throw "Healthcheck failed" }
            $payload = '{"prompt":"Hello","n_predict":8,"temperature":0}'
            $resp = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:18099/completion" -ContentType "application/json" -Body $payload -TimeoutSec 30
            if (-not $resp.content) { throw "Inference response missing content" }
            Write-Host "Inference smoke PASSED"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      # ── Checksums ──
      - name: Generate checksums
        shell: pwsh
        working-directory: electron-app/release
        run: |
          "# build-win-x64" | Out-File -FilePath SHA256SUMS.txt
          Get-ChildItem -File -Recurse | Where-Object { $_.Extension -in '.exe','.zip' -and $_.DirectoryName -notmatch 'win-unpacked' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -Append -FilePath SHA256SUMS.txt
          }
          if (Test-Path SHA256SUMS.txt) { Get-Content SHA256SUMS.txt }

      # ── Upload ──
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codin-win-x64
          path: |
            electron-app/release/*.exe
            electron-app/release/*.zip
            electron-app/release/SHA256SUMS.txt

  # ════════════════════════════════════════════════════════════
  # JOB 2: Build macOS (x64 + arm64)
  # ════════════════════════════════════════════════════════════
  build-mac:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }

      - name: Cache tiny GGUF model
        uses: actions/cache@v4
        with:
          path: electron-app/resources/models
          key: tiny-gguf-${{ runner.os }}-${{ hashFiles('.github/workflows/release-matrix.yml') }}

      - name: Fetch tiny GGUF model
        continue-on-error: true
        run: |
          MODEL_DIR="electron-app/resources/models"
          MODEL_PATH="$MODEL_DIR/tiny.gguf"
          mkdir -p "$MODEL_DIR"
          if [ ! -f "$MODEL_PATH" ]; then
            curl -fL --max-time 120 --retry 2 -o "$MODEL_PATH" "${{ env.TEST_MODEL_URL }}" || {
              echo "WARNING: GGUF model download failed — inference smoke tests will be skipped"
              rm -f "$MODEL_PATH"
              exit 0
            }
          fi
          if [ -f "$MODEL_PATH" ]; then
            BYTES=$(wc -c < "$MODEL_PATH")
            if [ "$BYTES" -lt "${{ env.MIN_MODEL_BYTES }}" ]; then
              echo "WARNING: GGUF model too small ($BYTES bytes), removing"
              rm -f "$MODEL_PATH"
            else
              echo "Model OK: $BYTES bytes"
              echo "MODEL_PATH=$MODEL_PATH" >> "$GITHUB_ENV"
            fi
          fi

      # ── Download llama-server for darwin/${{ matrix.arch }} ──
      - name: Fetch llama-server (darwin/${{ matrix.arch }})
        run: |
          set -euo pipefail
          DIR="electron-app/resources/bin/darwin/${{ matrix.arch }}"
          mkdir -p "$DIR"
          if [ ! -f "$DIR/codein-llm" ]; then
            TAG="${{ env.LLAMA_RELEASE }}"
            URL="https://github.com/ggml-org/llama.cpp/releases/download/${TAG}/llama-${TAG}-bin-macos-${{ matrix.arch }}.zip"
            echo "Downloading $URL"
            curl -fL -o "$DIR/llama.zip" "$URL"
            unzip -o "$DIR/llama.zip" -d "$DIR/tmp"
            FOUND=$(find "$DIR/tmp" -name "llama-server" -type f | head -1)
            test -n "$FOUND"
            # Copy all files from the bin directory (includes companion dylibs)
            FOUND_DIR=$(dirname "$FOUND")
            cp "$FOUND_DIR"/* "$DIR/"
            # Rename for branding
            mv "$DIR/llama-server" "$DIR/codein-llm"
            chmod +x "$DIR/codein-llm"
            rm -rf "$DIR/tmp" "$DIR/llama.zip"
          fi
          test -f "$DIR/codein-llm"
          test -x "$DIR/codein-llm"
          BYTES=$(wc -c < "$DIR/codein-llm")
          if [ "$BYTES" -lt "${{ env.MIN_BIN_BYTES }}" ]; then
            echo "Binary too small: $BYTES"; exit 1
          fi
          echo "--- Bundled files ---"
          ls -la "$DIR/"
          "$DIR/codein-llm" --help >/dev/null || true

      - name: Mirror binaries to legacy assets path
        run: |
          set -euo pipefail
          mkdir -p "electron-app/assets/llama/darwin/${{ matrix.arch }}"
          # Copy ALL files (binary + companion libraries)
          cp electron-app/resources/bin/darwin/${{ matrix.arch }}/* "electron-app/assets/llama/darwin/${{ matrix.arch }}/"

      # ── Install + build ──
      - name: Install dependencies
        working-directory: electron-app
        run: npm install

      - name: Build TypeScript
        working-directory: electron-app
        run: npm run build

      - name: Run E2E inference smoke (if model available)
        continue-on-error: true
        run: |
          MODEL="electron-app/resources/models/tiny.gguf"
          if [ ! -f "$MODEL" ]; then
            echo "WARNING: Skipping E2E inference smoke — no model downloaded"
            exit 0
          fi
          export LLAMA_PATH="${GITHUB_WORKSPACE}/electron-app/resources/bin/darwin/${{ matrix.arch }}/codein-llm"
          export LLAMA_TEST_MODEL="${GITHUB_WORKSPACE}/electron-app/resources/models/tiny.gguf"
          node --test electron-app/test/llama-spawn.e2e.test.cjs

      # ── Package ──
      - name: Build Electron (macOS DMG)
        working-directory: electron-app
        run: npx electron-builder --mac dmg --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # ── Inference smoke (soft — skipped if no model) ──
      - name: Inference smoke (if model available)
        continue-on-error: true
        run: |
          BIN="electron-app/resources/bin/darwin/${{ matrix.arch }}/codein-llm"
          MODEL="electron-app/resources/models/tiny.gguf"
          if [ ! -f "$MODEL" ]; then
            echo "WARNING: Skipping inference smoke — no model downloaded"
            exit 0
          fi
          "$BIN" --model "$MODEL" --port 18099 --host 127.0.0.1 --ctx-size 256 --n-gpu-layers 0 >/tmp/llama.log 2>&1 &
          PID=$!
          sleep 15
          curl -sf http://127.0.0.1:18099/health >/dev/null
          curl -sf -X POST http://127.0.0.1:18099/completion -H "Content-Type: application/json" -d '{"prompt":"Hello","n_predict":8,"temperature":0}' | grep -q "content"
          echo "Inference smoke PASSED"
          kill "$PID" 2>/dev/null || true

      # ── Checksums ──
      - name: Generate checksums
        working-directory: electron-app/release
        run: |
          echo "# build-mac-${{ matrix.arch }}" > SHA256SUMS.txt
          find . -name "*.dmg" -o -name "*.zip" | while read f; do
            sha256sum "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt 2>/dev/null || echo "No artifacts"

      # ── Upload ──
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codin-mac-${{ matrix.arch }}
          path: |
            electron-app/release/*.dmg
            electron-app/release/*.zip
            electron-app/release/SHA256SUMS.txt

  # ════════════════════════════════════════════════════════════
  # JOB 3: Build Linux x64
  # ════════════════════════════════════════════════════════════
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }

      - name: Cache tiny GGUF model
        uses: actions/cache@v4
        with:
          path: electron-app/resources/models
          key: tiny-gguf-${{ runner.os }}-${{ hashFiles('.github/workflows/release-matrix.yml') }}

      - name: Fetch tiny GGUF model
        continue-on-error: true
        run: |
          MODEL_DIR="electron-app/resources/models"
          MODEL_PATH="$MODEL_DIR/tiny.gguf"
          mkdir -p "$MODEL_DIR"
          if [ ! -f "$MODEL_PATH" ]; then
            curl -fL --max-time 120 --retry 2 -o "$MODEL_PATH" "${{ env.TEST_MODEL_URL }}" || {
              echo "WARNING: GGUF model download failed — inference smoke tests will be skipped"
              rm -f "$MODEL_PATH"
              exit 0
            }
          fi
          if [ -f "$MODEL_PATH" ]; then
            BYTES=$(wc -c < "$MODEL_PATH")
            if [ "$BYTES" -lt "${{ env.MIN_MODEL_BYTES }}" ]; then
              echo "WARNING: GGUF model too small ($BYTES bytes), removing"
              rm -f "$MODEL_PATH"
            else
              echo "Model OK: $BYTES bytes"
              echo "MODEL_PATH=$MODEL_PATH" >> "$GITHUB_ENV"
            fi
          fi

      # ── Download llama-server for linux/x64 ──
      - name: Fetch llama-server (linux/x64)
        run: |
          set -euo pipefail
          DIR="electron-app/resources/bin/linux/x64"
          mkdir -p "$DIR"
          if [ ! -f "$DIR/codein-llm" ]; then
            TAG="${{ env.LLAMA_RELEASE }}"
            URL="https://github.com/ggml-org/llama.cpp/releases/download/${TAG}/llama-${TAG}-bin-ubuntu-x64.zip"
            echo "Downloading $URL"
            curl -fL -o "$DIR/llama.zip" "$URL"
            unzip -o "$DIR/llama.zip" -d "$DIR/tmp"
            FOUND=$(find "$DIR/tmp" -name "llama-server" -type f | head -1)
            test -n "$FOUND"
            # Copy all files from the bin directory (includes companion .so libs)
            FOUND_DIR=$(dirname "$FOUND")
            cp "$FOUND_DIR"/* "$DIR/"
            # Rename for branding
            mv "$DIR/llama-server" "$DIR/codein-llm"
            chmod +x "$DIR/codein-llm"
            rm -rf "$DIR/tmp" "$DIR/llama.zip"
          fi
          test -f "$DIR/codein-llm"
          test -x "$DIR/codein-llm"
          BYTES=$(wc -c < "$DIR/codein-llm")
          if [ "$BYTES" -lt "${{ env.MIN_BIN_BYTES }}" ]; then
            echo "Binary too small: $BYTES"; exit 1
          fi
          echo "--- Bundled files ---"
          ls -la "$DIR/"
          "$DIR/codein-llm" --help >/dev/null || true

      - name: Mirror binaries to legacy assets path
        run: |
          set -euo pipefail
          mkdir -p "electron-app/assets/llama/linux/x64"
          # Copy ALL files (binary + companion libraries)
          cp electron-app/resources/bin/linux/x64/* "electron-app/assets/llama/linux/x64/"

      # ── Install + build ──
      - name: Install dependencies
        working-directory: electron-app
        run: npm install

      - name: Build TypeScript
        working-directory: electron-app
        run: npm run build

      - name: Run E2E inference smoke (if model available)
        continue-on-error: true
        run: |
          MODEL="electron-app/resources/models/tiny.gguf"
          if [ ! -f "$MODEL" ]; then
            echo "WARNING: Skipping E2E inference smoke — no model downloaded"
            exit 0
          fi
          export LLAMA_PATH="${GITHUB_WORKSPACE}/electron-app/resources/bin/linux/x64/codein-llm"
          export LLAMA_TEST_MODEL="${GITHUB_WORKSPACE}/electron-app/resources/models/tiny.gguf"
          node --test electron-app/test/llama-spawn.e2e.test.cjs

      # ── Package ──
      - name: Build Electron (Linux AppImage + deb)
        working-directory: electron-app
        run: npx electron-builder --linux AppImage deb --x64

      # ── Inference smoke (soft — skipped if no model) ──
      - name: Inference smoke (if model available)
        continue-on-error: true
        run: |
          BIN="electron-app/resources/bin/linux/x64/codein-llm"
          MODEL="electron-app/resources/models/tiny.gguf"
          if [ ! -f "$MODEL" ]; then
            echo "WARNING: Skipping inference smoke — no model downloaded"
            exit 0
          fi
          "$BIN" --model "$MODEL" --port 18099 --host 127.0.0.1 --ctx-size 256 --n-gpu-layers 0 >/tmp/llama.log 2>&1 &
          PID=$!
          sleep 15
          curl -sf http://127.0.0.1:18099/health >/dev/null
          curl -sf -X POST http://127.0.0.1:18099/completion -H "Content-Type: application/json" -d '{"prompt":"Hello","n_predict":8,"temperature":0}' | grep -q "content"
          echo "Inference smoke PASSED"
          kill "$PID" 2>/dev/null || true

      # ── Checksums ──
      - name: Generate checksums
        working-directory: electron-app/release
        run: |
          echo "# build-linux-x64" > SHA256SUMS.txt
          find . -name "*.AppImage" -o -name "*.deb" | while read f; do
            sha256sum "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt 2>/dev/null || echo "No artifacts"

      # ── Upload ──
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codin-linux-x64
          path: |
            electron-app/release/*.AppImage
            electron-app/release/*.deb
            electron-app/release/SHA256SUMS.txt

  # ════════════════════════════════════════════════════════════
  # JOB 4: Aggregate + GitHub Release
  # ════════════════════════════════════════════════════════════
  release:
    needs: [build-win-x64, build-mac, build-linux-x64]
    runs-on: ubuntu-latest
    if: github.repository == 'inbharat-ai/codein.pro' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts/

      - name: Aggregate checksums
        run: |
          echo "# CodeIn Release Checksums" > SHA256SUMS.txt
          echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> SHA256SUMS.txt
          echo "" >> SHA256SUMS.txt
          find all-artifacts/ -name "SHA256SUMS.txt" | while read f; do
            echo "## $(dirname $f | sed 's|all-artifacts/||')" >> SHA256SUMS.txt
            cat "$f" >> SHA256SUMS.txt
            echo "" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: List all artifacts
        run: find all-artifacts/ -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) -exec ls -la {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: "CodeIn ${{ github.event.inputs.version || github.ref_name }}"
          body_path: docs/RELEASE_NOTES.md
          files: |
            all-artifacts/**/*.exe
            all-artifacts/**/*.dmg
            all-artifacts/**/*.zip
            all-artifacts/**/*.AppImage
            all-artifacts/**/*.deb
            SHA256SUMS.txt
          draft: false
          prerelease: true
