name: Run CodeIn Agent

on:
  workflow_call:
    inputs:
      prompt:
        description: "Additional prompting to send to the CodeIn agent"
        required: false
        type: string
        default: ""
      agent:
        description: "The agent to use"
        required: true
        type: string
        default: "inbharat-ai/codein-agent"
      branch_name:
        description: "The base branch name to work from"
        required: false
        type: string
        default: "main"
    secrets:
      CODEIN_API_KEY:
        required: false

jobs:
  run-agent:
    # Disabled until CodeIn's own agent API is available.
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Call agents endpoint
        env:
          PROMPT: ${{ inputs.prompt }}
          AGENT: ${{ inputs.agent }}
          BRANCH_NAME: ${{ inputs.branch_name }}
          REPO_URL: https://github.com/${{ github.repository }}
          CODEIN_API_KEY: ${{ secrets.CODEIN_API_KEY }}
        run: |
          json_body=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg agent "$AGENT" \
            --arg branchName "$BRANCH_NAME" \
            --arg repoUrl "$REPO_URL" \
            '{prompt: $prompt, agent: $agent, branchName: $branchName, repoUrl: $repoUrl}')

          response=$(curl -f -X POST https://api.codein.pro/agents \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CODEIN_API_KEY" \
            -d "$json_body")
          id=$(echo $response | jq -r '.id')
          echo "https://codein.pro/hub?type=agents/$id"
