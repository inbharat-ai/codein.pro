# CodeIn Electron Multi-OS Release Build
#
# Builds distributable artifacts for Windows, macOS, and Linux.
# Triggers: manual dispatch or tag push matching v*.
#
# Prerequisites (GitHub Secrets):
#   - APPLE_ID, APPLE_ID_PASSWORD, APPLE_TEAM_ID (macOS notarization)
#   - CSC_LINK, CSC_KEY_PASSWORD (Windows code signing, optional)
#
# Outputs: Artifacts uploaded to GitHub Actions run, plus GitHub Release.

name: "CodeIn Electron Release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.0.3-beta)"
        required: true
        default: "v1.0.3-beta"
  push:
    tags:
      - "v*-electron"
      - "v*-beta"

permissions:
  contents: write

env:
  NODE_VERSION: "20"

jobs:
  # ─── STEP 1: Download llama-server binaries for all OS ───
  fetch-llama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download llama-server (win32-x64)
        run: |
          mkdir -p electron-app/assets/llama/win32/x64
          curl -L -o /tmp/llama-win-x64.zip \
            "https://github.com/ggml-org/llama.cpp/releases/download/b3906/llama-b3906-bin-win-avx2-x64.zip"
          unzip -o /tmp/llama-win-x64.zip -d /tmp/llama-win-x64
          # Copy ALL files from binary's directory (exe + ggml.dll, llama.dll, etc.)
          LLAMA_EXE=$(find /tmp/llama-win-x64 -name "llama-server.exe" -print -quit)
          if [ -z "$LLAMA_EXE" ]; then echo "ERROR: llama-server.exe not found in archive"; exit 1; fi
          LLAMA_DIR=$(dirname "$LLAMA_EXE")
          cp "$LLAMA_DIR"/* electron-app/assets/llama/win32/x64/
          # Rename to codein-llm.exe for branding
          mv electron-app/assets/llama/win32/x64/llama-server.exe electron-app/assets/llama/win32/x64/codein-llm.exe
          # Verify critical DLLs are present
          test -f electron-app/assets/llama/win32/x64/ggml.dll || { echo "FATAL: ggml.dll not found after copy"; exit 1; }
          test -f electron-app/assets/llama/win32/x64/llama.dll || { echo "FATAL: llama.dll not found after copy"; exit 1; }
          test -f electron-app/assets/llama/win32/x64/codein-llm.exe || { echo "FATAL: codein-llm.exe not found"; exit 1; }
          echo "--- Bundled files ---"
          ls -la electron-app/assets/llama/win32/x64/

      - name: Download llama-server (darwin-arm64)
        run: |
          mkdir -p electron-app/assets/llama/darwin/arm64
          curl -L -o /tmp/llama-darwin-arm64.zip \
            "https://github.com/ggml-org/llama.cpp/releases/download/b3906/llama-b3906-bin-macos-arm64.zip"
          unzip -o /tmp/llama-darwin-arm64.zip -d /tmp/llama-darwin-arm64
          # Copy ALL files from binary's directory (exe + dylibs)
          LLAMA_BIN=$(find /tmp/llama-darwin-arm64 -name "llama-server" -type f -print -quit)
          if [ -z "$LLAMA_BIN" ]; then echo "ERROR: llama-server not found in archive"; exit 1; fi
          LLAMA_DIR=$(dirname "$LLAMA_BIN")
          cp "$LLAMA_DIR"/* electron-app/assets/llama/darwin/arm64/
          # Rename for branding
          mv electron-app/assets/llama/darwin/arm64/llama-server electron-app/assets/llama/darwin/arm64/codein-llm
          chmod +x electron-app/assets/llama/darwin/arm64/codein-llm
          echo "--- Bundled files ---"
          ls -la electron-app/assets/llama/darwin/arm64/

      - name: Download llama-server (darwin-x64)
        run: |
          mkdir -p electron-app/assets/llama/darwin/x64
          curl -L -o /tmp/llama-darwin-x64.zip \
            "https://github.com/ggml-org/llama.cpp/releases/download/b3906/llama-b3906-bin-macos-x64.zip"
          unzip -o /tmp/llama-darwin-x64.zip -d /tmp/llama-darwin-x64
          # Copy ALL files from binary's directory (exe + dylibs)
          LLAMA_BIN=$(find /tmp/llama-darwin-x64 -name "llama-server" -type f -print -quit)
          if [ -z "$LLAMA_BIN" ]; then echo "ERROR: llama-server not found in archive"; exit 1; fi
          LLAMA_DIR=$(dirname "$LLAMA_BIN")
          cp "$LLAMA_DIR"/* electron-app/assets/llama/darwin/x64/
          # Rename for branding
          mv electron-app/assets/llama/darwin/x64/llama-server electron-app/assets/llama/darwin/x64/codein-llm
          chmod +x electron-app/assets/llama/darwin/x64/codein-llm
          echo "--- Bundled files ---"
          ls -la electron-app/assets/llama/darwin/x64/

      - name: Download llama-server (linux-x64)
        run: |
          mkdir -p electron-app/assets/llama/linux/x64
          curl -L -o /tmp/llama-linux-x64.zip \
            "https://github.com/ggml-org/llama.cpp/releases/download/b3906/llama-b3906-bin-ubuntu-x64.zip"
          unzip -o /tmp/llama-linux-x64.zip -d /tmp/llama-linux-x64
          # Copy ALL files from binary's directory (exe + shared libs)
          LLAMA_BIN=$(find /tmp/llama-linux-x64 -name "llama-server" -type f -print -quit)
          if [ -z "$LLAMA_BIN" ]; then echo "ERROR: llama-server not found in archive"; exit 1; fi
          LLAMA_DIR=$(dirname "$LLAMA_BIN")
          cp "$LLAMA_DIR"/* electron-app/assets/llama/linux/x64/
          # Rename for branding
          mv electron-app/assets/llama/linux/x64/llama-server electron-app/assets/llama/linux/x64/codein-llm
          chmod +x electron-app/assets/llama/linux/x64/codein-llm
          echo "--- Bundled files ---"
          ls -la electron-app/assets/llama/linux/x64/

      - name: Upload llama assets
        uses: actions/upload-artifact@v4
        with:
          name: llama-binaries
          path: electron-app/assets/llama/

  # ─── STEP 2: Build Windows ───
  build-windows:
    needs: fetch-llama
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: llama-binaries
          path: electron-app/assets/llama/

      - name: Verify llama DLLs present
        shell: pwsh
        run: |
          Write-Host "--- Verifying llama assets after artifact download ---"
          Get-ChildItem -Recurse "electron-app/assets/llama/win32/x64/" | Format-Table Name, Length
          if (-not (Test-Path "electron-app/assets/llama/win32/x64/ggml.dll")) { throw "FATAL: ggml.dll missing from downloaded artifact!" }
          if (-not (Test-Path "electron-app/assets/llama/win32/x64/llama.dll")) { throw "FATAL: llama.dll missing from downloaded artifact!" }
          if (-not (Test-Path "electron-app/assets/llama/win32/x64/codein-llm.exe")) { throw "FATAL: codein-llm.exe missing from downloaded artifact!" }
          Write-Host "All required DLLs verified OK"

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Install dependency packages
        run: |
          cd packages/config-types && npm install --ignore-scripts
          cd ../config-yaml && npm install --ignore-scripts
          cd ../terminal-security && npm install --ignore-scripts
          cd ../fetch && npm install --ignore-scripts
          cd ../llm-info && npm install --ignore-scripts
          cd ../openai-adapters && npm install --ignore-scripts

      - name: Build dependency packages
        run: |
          cd packages/config-types && npm run build
          cd ../config-yaml && npm run build
          cd ../terminal-security && npm run build
          cd ../fetch && npm run build
          cd ../llm-info && npm run build
          cd ../openai-adapters && npm run build

      - name: Install core dependencies
        working-directory: core
        run: npm install --ignore-scripts

      - name: Build GUI
        working-directory: gui
        run: |
          npm install
          npm run build

      - name: Build Agent
        working-directory: packages/agent
        run: npm install

      - name: Install dependencies
        working-directory: electron-app
        run: npm install

      - name: Rebuild native modules for Electron
        working-directory: electron-app
        run: npx @electron/rebuild -f 28.2.0 -t prod

      - name: Build TypeScript
        working-directory: electron-app
        run: npm run build

      - name: Build Electron (Windows NSIS + Portable)
        working-directory: electron-app
        run: npx electron-builder --win nsis portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify packaged DLLs
        shell: pwsh
        run: |
          Write-Host "--- Verifying DLLs in packaged app ---"
          $llamaDir = "electron-app/release/win-unpacked/resources/llama/win32/x64"
          if (Test-Path $llamaDir) {
            Get-ChildItem $llamaDir | Format-Table Name, Length
            if (-not (Test-Path "$llamaDir/ggml.dll")) { throw "FATAL: ggml.dll missing from packaged app!" }
            if (-not (Test-Path "$llamaDir/codein-llm.exe")) { throw "FATAL: codein-llm.exe missing from packaged app!" }
            Write-Host "Packaged DLLs verified OK"
          } else {
            Write-Warning "win-unpacked dir not found (portable build may differ) — checking assets"
            Get-ChildItem -Recurse "electron-app/release" -Filter "ggml.dll" | Format-Table FullName
          }

      - name: List artifacts
        working-directory: electron-app/release
        run: Get-ChildItem -Recurse -File | Where-Object { $_.Extension -in '.exe','.zip','.blockmap','.yml' } | Select-Object Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codin-windows
          path: |
            electron-app/release/*.exe
            electron-app/release/*.zip
            electron-app/release/*.blockmap
            electron-app/release/*.yml

  # ─── STEP 3: Build macOS ───
  build-macos:
    needs: fetch-llama
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: llama-binaries
          path: electron-app/assets/llama/

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Install dependency packages
        run: |
          cd packages/config-types && npm install --ignore-scripts
          cd ../config-yaml && npm install --ignore-scripts
          cd ../terminal-security && npm install --ignore-scripts
          cd ../fetch && npm install --ignore-scripts
          cd ../llm-info && npm install --ignore-scripts
          cd ../openai-adapters && npm install --ignore-scripts

      - name: Build dependency packages
        run: |
          cd packages/config-types && npm run build
          cd ../config-yaml && npm run build
          cd ../terminal-security && npm run build
          cd ../fetch && npm run build
          cd ../llm-info && npm run build
          cd ../openai-adapters && npm run build

      - name: Install core dependencies
        working-directory: core
        run: npm install --ignore-scripts

      - name: Build GUI
        working-directory: gui
        run: |
          # Remove lockfile so npm regenerates platform-specific optional deps
          # (fixes npm#4828: @rollup/rollup-darwin-arm64 not installed from Windows lockfile)
          rm -f package-lock.json
          npm install
          npm run build

      - name: Build Agent
        working-directory: packages/agent
        run: npm install

      - name: Install dependencies
        working-directory: electron-app
        run: npm install

      - name: Rebuild native modules for Electron
        working-directory: electron-app
        run: npx @electron/rebuild -f 28.2.0 -t prod

      - name: Build TypeScript
        working-directory: electron-app
        run: npm run build

      - name: Build Electron (macOS DMG + ZIP)
        working-directory: electron-app
        run: npx electron-builder --mac dmg zip --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Uncomment for notarization:
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: List artifacts
        working-directory: electron-app/release
        run: ls -la *.dmg *.zip 2>/dev/null || echo "No DMG/ZIP found"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codin-macos
          path: |
            electron-app/release/*.dmg
            electron-app/release/*.zip

  # ─── STEP 4: Build Linux ───
  build-linux:
    needs: fetch-llama
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: llama-binaries
          path: electron-app/assets/llama/

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Install dependency packages
        run: |
          cd packages/config-types && npm install --ignore-scripts
          cd ../config-yaml && npm install --ignore-scripts
          cd ../terminal-security && npm install --ignore-scripts
          cd ../fetch && npm install --ignore-scripts
          cd ../llm-info && npm install --ignore-scripts
          cd ../openai-adapters && npm install --ignore-scripts

      - name: Build dependency packages
        run: |
          cd packages/config-types && npm run build
          cd ../config-yaml && npm run build
          cd ../terminal-security && npm run build
          cd ../fetch && npm run build
          cd ../llm-info && npm run build
          cd ../openai-adapters && npm run build

      - name: Install core dependencies
        working-directory: core
        run: npm install --ignore-scripts

      - name: Build GUI
        working-directory: gui
        run: |
          # Remove lockfile so npm regenerates platform-specific optional deps
          # (fixes npm#4828: @rollup/rollup-linux-x64-gnu not installed from Windows lockfile)
          rm -f package-lock.json
          npm install
          npm run build

      - name: Build Agent
        working-directory: packages/agent
        run: npm install

      - name: Install dependencies
        working-directory: electron-app
        run: npm install

      - name: Rebuild native modules for Electron
        working-directory: electron-app
        run: npx @electron/rebuild -f 28.2.0 -t prod

      - name: Build TypeScript
        working-directory: electron-app
        run: npm run build

      - name: Build Electron (Linux AppImage + deb + rpm)
        working-directory: electron-app
        run: npx electron-builder --linux AppImage deb rpm --x64 --publish never

      - name: List artifacts
        working-directory: electron-app/release
        run: ls -la *.AppImage *.deb *.rpm 2>/dev/null || echo "No AppImage/deb/rpm found"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codin-linux
          path: |
            electron-app/release/*.AppImage
            electron-app/release/*.deb
            electron-app/release/*.rpm

  # ─── STEP 5: Checksums + GitHub Release ───
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: github.repository == 'inbharat-ai/codein.pro'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: codin-windows
          path: artifacts/codin-windows/

      - uses: actions/download-artifact@v4
        with:
          name: codin-macos
          path: artifacts/codin-macos/

      - uses: actions/download-artifact@v4
        with:
          name: codin-linux
          path: artifacts/codin-linux/

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) | while read f; do
            sha256sum "$f" >> ../SHA256SUMS.txt
          done
          cat ../SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: "CodeIn ${{ github.event.inputs.version || github.ref_name }}"
          body_path: docs/RELEASE_NOTES.md
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            SHA256SUMS.txt
          draft: false
          prerelease: ${{ contains(github.event.inputs.version || github.ref_name, 'beta') || contains(github.event.inputs.version || github.ref_name, 'alpha') }}
